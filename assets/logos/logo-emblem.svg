<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Red House Estates emblem">
  <title>Red House Estates Emblem</title>
  <circle cx="200" cy="200" r="196" fill="#fff" stroke="#8B263E" stroke-width="8"/>
  <!-- stylized cone / roof -->
  <g transform="translate(0,10)">
    <polygon points="200,70 120,240 280,240" fill="#8B263E" opacity="0.95"/>
    <!-- leaf accent -->
    <path d="M245 200 C265 170 310 150 320 120 C290 135 270 160 245 200Z" fill="#2C5E43" opacity="0.95"/>
    <!-- house door -->
    <rect x="190" y="200" width="20" height="40" fill="#fff" rx="3"/>
  </g>
  <text x="200" y="320" font-family="Segoe UI, system-ui, Arial" font-size="20" fill="#2B2D42" font-weight="700" text-anchor="middle">Red House Estates</text>
</svg>
